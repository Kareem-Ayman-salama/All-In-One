name: AIN Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "docs/mobile-openapi.json"
      - "scripts/validate-integration.mjs"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "docs/mobile-openapi.json"
      - "scripts/validate-integration.mjs"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze mobile app
        run: flutter analyze --no-fatal-infos

      - name: Run mobile tests
        run: flutter test

  mobile-android-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: mobile-static
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Build staging Android smoke artifact
        run: >
          flutter build apk
          --flavor staging
          --dart-define=AIN_FLAVOR=staging
          --dart-define=AIN_API_BASE_URL=https://staging-api.example.com/api/v1
          --dart-define=AIN_ENABLE_CRASH_REPORTING=true
          --dart-define=AIN_ALLOW_MOCK_DATA=false
