name: ain_mobile
description: منصة عين | AIN Platform mobile application connected to the Laravel backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  cupertino_icons: 1.0.8
  dio: ^5.7.0
  file_picker: 10.3.3
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  go_router: ^14.6.3
  intl: ^0.20.1
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#16458F"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#16458F"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#16458F"
    image: assets/branding/splash_icon_android12.png
