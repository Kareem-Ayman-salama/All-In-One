name: ain_mobile
description: AIN All In One mobile application connected to the existing Laravel backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.2
  dio: ^5.7.0
  drift: ^2.23.1
  file_picker: ^8.1.7
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  go_router: ^14.6.3
  image_picker: ^1.1.2
  intl: ^0.20.1
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
